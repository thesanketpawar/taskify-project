apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: taskify
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mongodb-service
  namespace: taskify
subsets:
  - addresses:
      - ip: 10.0.3.144
    ports:
      - port: 27017
