apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: taskify
spec:
  type: ExternalName
  externalName: 10.0.3.144  # <-- Replace with your Database EC2's actual Private IP
  ports:
  - port: 27017
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mongodb-service
  namespace: taskify
subsets:
- addresses:
  - ip: 10.0.3.144 # Database EC2 Private IP
  ports:
  - port: 27017
